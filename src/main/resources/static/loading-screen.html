<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWE Attendance System - Sci-Fi Decrypting Loading Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #030408;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Cyber Matrix / Grid Canvas Background */
    #matrix-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.35;
      pointer-events: none;
    }

    /* Sci-Fi Vignette & Scanline Overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.4) 50%,
        rgba(0, 0, 0, 0.4)
      );
      background-size: 100% 4px;
      z-index: 2;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, #020305 90%);
      z-index: 3;
      pointer-events: none;
    }

    /* Holographic HUD Side Panels */
    .hud-left, .hud-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: rgba(56, 189, 248, 0.6);
      line-height: 1.5;
      z-index: 4;
      pointer-events: none;
      width: 220px;
    }

    .hud-left {
      left: 40px;
      border-left: 2px solid rgba(56, 189, 248, 0.3);
      padding-left: 14px;
    }

    .hud-right {
      right: 40px;
      text-align: right;
      border-right: 2px solid rgba(16, 185, 129, 0.3);
      padding-right: 14px;
    }

    .hud-tag {
      color: #38bdf8;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .hud-stream {
      font-family: 'Share Tech Mono', monospace;
      color: rgba(56, 189, 248, 0.45);
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Main Center Container */
    .loader-card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Ring & Logo Stage */
    .stage {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    /* Outer Ambient Glow */
    .ambient-glow {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(16, 185, 129, 0.2) 50%, transparent 75%);
      filter: blur(25px);
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0.9; }
    }

    /* Center S Logo */
    .center-logo {
      position: absolute;
      width: 105px;
      height: 105px;
      z-index: 10;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.8)) drop-shadow(0 0 28px rgba(16, 185, 129, 0.5));
      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }

    /* SVG Concentric HUD Rings */
    .hud-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      overflow: visible;
    }

    /* Fast Primary Cyan Segment */
    .ring-main {
      transform-origin: center;
      animation: rotateClockwise 3.5s linear infinite;
    }

    /* Dotted Emerald Counter-Ring */
    .ring-dots {
      transform-origin: center;
      animation: rotateCounterClockwise 7s linear infinite;
    }

    /* Segmented Outer Ticks */
    .ring-ticks {
      transform-origin: center;
      animation: rotateClockwise 12s linear infinite;
    }

    /* Orbiting Radar Ping Beam */
    .radar-beam {
      transform-origin: center;
      animation: rotateClockwise 2.2s linear infinite;
    }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateCounterClockwise {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Expanding Pulse Waves */
    .pulse-wave {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px solid rgba(56, 189, 248, 0.7);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      animation: expandWave 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      pointer-events: none;
    }

    .pulse-wave.delay {
      animation-delay: 1.4s;
    }

    @keyframes expandWave {
      0% {
        transform: scale(0.6);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    /* Brand Titles */
    .brand-title {
      font-family: 'Orbitron', 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.8), 0 0 24px rgba(56, 189, 248, 0.4);
      margin-bottom: 8px;
    }

    .brand-title span {
      background: linear-gradient(135deg, #38bdf8 0%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Terminal Decryption Status */
    .decrypt-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.1);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: blink 0.9s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .scramble-text {
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .dots {
      display: inline-block;
      width: 18px;
      text-align: left;
    }

    @media (max-width: 768px) {
      .hud-left, .hud-right {
        display: none;
      }
      .brand-title {
        font-size: 21px;
      }
      .stage {
        width: 220px;
        height: 220px;
      }
      .center-logo {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>
<body>

  <!-- Matrix / Cyber Rain Background Canvas -->
  <canvas id="matrix-canvas"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- Sci-Fi HUD Left Data Stream -->
  <div class="hud-left">
    <div class="hud-tag">▶ SYS.TELEMETRY</div>
    <div>LAT: 24.9172° N</div>
    <div>LON: 91.8319° E</div>
    <div>ALT: 28.4m [GPS-LOCK]</div>
    <div style="margin-top: 8px;" class="hud-tag">▶ CRYPTO.STREAM</div>
    <div class="hud-stream" id="crypto-stream-left">INIT AES_256_GCM...</div>
  </div>

  <!-- Sci-Fi HUD Right Data Stream -->
  <div class="hud-right">
    <div class="hud-tag">▶ DECRYPT.STATUS</div>
    <div>HASH: HMAC_SHA256</div>
    <div>ROTATION: 1000ms</div>
    <div>DEVICE_AUTH: BOUND</div>
    <div style="margin-top: 8px;" class="hud-tag">▶ GEOFENCE.NODE</div>
    <div class="hud-stream" id="crypto-stream-right">GEOFENCE_RADIUS: 10m</div>
  </div>

  <!-- Center Loader Card -->
  <div class="loader-card">

      <div class="ambient-glow"></div>

      <div class="pulse-wave"></div>

            <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
            <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
          </linearGradient>
          <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
          </linearGradient>
          <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Outer Track Ring -->
        <circle cx="130" cy="130" r="118" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />

        <!-- Outer Ticks (Clockwise 12s) -->
        <g class="ring-ticks">
          <circle cx="130" cy="130" r="118" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2.5" 
                  stroke-dasharray="4 20" />
          <circle cx="130" cy="12" r="3" fill="#38bdf8" filter="url(#neonGlow)" />
          <circle cx="130" cy="248" r="3" fill="#34d399" filter="url(#neonGlow)" />
        </g>

        <!-- Main Glowing Cyan Arc (Clockwise 3.5s) -->
        <g class="ring-main" filter="url(#neonGlow)">
          <!-- Leading heavy arc -->
          <circle cx="130" cy="130" r="102" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" 
                  stroke-dasharray="210 430" stroke-linecap="round" />
          <!-- Small trailing spark -->
          <circle cx="130" cy="130" r="102" fill="none" stroke="#34d399" stroke-width="3" 
                  stroke-dasharray="40 590" stroke-dashoffset="-260" stroke-linecap="round" />
          <!-- Head node -->
          <circle cx="232" cy="130" r="4.5" fill="#ffffff" filter="url(#neonGlow)" />
        </g>

        <!-- Dotted Emerald Middle Ring (Counter-Clockwise 7s) -->
        <g class="ring-dots">
          <circle cx="130" cy="130" r="86" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" 
                  stroke-dasharray="3 14" stroke-linecap="round" />
          <circle cx="130" cy="44" r="2.5" fill="#38bdf8" />
          <circle cx="44" cy="130" r="2.5" fill="#34d399" />
        </g>

        <!-- Inner Target Reticle (Static / Slow Drift) -->
        <circle cx="130" cy="130" r="70" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" stroke-dasharray="10 30" />
      </svg>

    <!-- Title Branding -->
    <h1 class="brand-title">SWE <span>Attendance System</span></h1>

    <!-- Sci-Fi Decrypting Status Terminal -->
    <div class="decrypt-box">
      <div class="status-dot"></div>
      <div id="decrypt-message">
        <span class="scramble-text" id="status-text">DECRYPTING PROTOCOL</span><span class="dots" id="status-dots">....</span>
      </div>
    </div>

  </div>

  <script>
    // 1. Matrix / Cyber Rain Decrypting Canvas
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789ABCDEFΣΩΨλπΔSWEGEOFENCEHAIVERSINE0x7F';
    const fontSize = 13;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1).map(() => Math.floor(Math.random() * -50));

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 4, 8, 0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `${fontSize}px 'Share Tech Mono', monospace`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        if (Math.random() > 0.85) {
          ctx.fillStyle = '#ffffff'; // occasional bright spark
        } else if (Math.random() > 0.5) {
          ctx.fillStyle = '#38bdf8'; // cyan
        } else {
          ctx.fillStyle = '#10b981'; // emerald
        }

        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 45);

    // 2. Sci-Fi Decrypting Text Scrambler
    const phrases = [
      "DECRYPTING ATTENDANCE PROTOCOL",
      "CALIBRATING HAVERSINE GPS MATRIX",
      "BINDING HARDWARE DEVICE LOCK",
      "VERIFYING 1-SEC HMAC TOKEN STREAM",
      "SYNCHRONIZING TEACHER GEOFENCE NODE",
      "ESTABLISHING HIGH-PRECISION SESSION"
    ];

    let currentPhraseIndex = 0;
    const statusTextEl = document.getElementById('status-text');
    const statusDotsEl = document.getElementById('status-dots');

    function scrambleTo(targetText, callback) {
      const glyphs = '01#@!&%?><~*/[]{}+=';
      let iteration = 0;
      const totalIterations = targetText.length * 2;

      const interval = setInterval(() => {
        let result = '';
        for (let i = 0; i < targetText.length; i++) {
          if (i < Math.floor(iteration / 2)) {
            result += targetText[i];
          } else {
            result += glyphs[Math.floor(Math.random() * glyphs.length)];
          }
        }
        statusTextEl.textContent = result;
        iteration++;

        if (iteration >= totalIterations) {
          clearInterval(interval);
          statusTextEl.textContent = targetText;
          if (callback) callback();
        }
      }, 30);
    }

    function cyclePhrases() {
      currentPhraseIndex = (currentPhraseIndex + 1) % phrases.length;
      scrambleTo(phrases[currentPhraseIndex], () => {
        setTimeout(cyclePhrases, 2600);
      });
    }
    setTimeout(cyclePhrases, 2000);

    // 3. Dots Animation
    let dotCount = 0;
    setInterval(() => {
      dotCount = (dotCount + 1) % 5;
      statusDotsEl.textContent = '.'.repeat(dotCount);
    }, 350);

    // 4. Random Hex Stream in Side HUDs
    const leftStream = document.getElementById('crypto-stream-left');
    const rightStream = document.getElementById('crypto-stream-right');

    function generateHexBlock() {
      let hex = '';
      for (let i = 0; i < 4; i++) {
        hex += '0x' + Math.floor(Math.random() * 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0') + '\n';
      }
      return hex;
    }

    setInterval(() => {
      leftStream.textContent = generateHexBlock();
      rightStream.textContent = 'NONCE: ' + Math.floor(Math.random() * 99999999).toString(16).toUpperCase() + '\n' + generateHexBlock();
    }, 600);
  </script>
