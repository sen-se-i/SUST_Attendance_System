spring:
  application:
    name: jarvis-attendance
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:h2:file:./data/jarvis_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:${DATABASE_USERNAME:sa}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:}}}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
    out-of-order: true
  mail:
    host: localhost
    port: 1025

server:
  port: ${PORT:8080}

jarvis:
  crypto:
    hmac-secret: ${JARVIS_HMAC_SECRET:dev-hmac-secret-change-before-prod-dev-hmac-secret}
    aes-key: ${JARVIS_AES_KEY:dev-aes-key-32-bytes-change-now!!}
  jwt:
    secret: ${JARVIS_JWT_SECRET:dev-jwt-secret-change-before-prod-dev-jwt-secret}
    ttl: PT24H
