spring:
  application:
    name: jarvis-attendance
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/jarvis_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
    out-of-order: true
  mail:
    host: localhost
    port: 1025

server:
  port: ${PORT:8080}

jarvis:
  crypto:
    hmac-secret: ${JARVIS_HMAC_SECRET:dev-hmac-secret-change-before-prod-dev-hmac-secret}
    aes-key: ${JARVIS_AES_KEY:dev-aes-key-32-bytes-change-now!!}
  jwt:
    secret: ${JARVIS_JWT_SECRET:dev-jwt-secret-change-before-prod-dev-jwt-secret}
    ttl: PT24H
