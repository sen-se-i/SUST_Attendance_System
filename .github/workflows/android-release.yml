name: Build and release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  API_BASE_URL: https://swe-attendance.onrender.com

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Upload APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter Android platform files
        working-directory: flutter_app
        run: flutter create --platforms=android .

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Copy Flutter APK
        run: find flutter_app/build -name "*.apk" -exec cp {} swe-attendance-flutter.apk \;

      - name: Install Web frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web assets for Capacitor
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: npx vite build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build Capacitor APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy Capacitor APK
        run: find frontend/android -name "*.apk" -exec cp {} swe-attendance-web.apk \;

      - name: Release APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: SWE-Attendance ${{ github.ref_name }}
          body: |
            ## 📍 SWE-Attendance Release ${{ github.ref_name }}

            Downloadable Android APKs:
            - **`swe-attendance-flutter.apk`**: Native Flutter & Dart GPS Attendance App.
            - **`swe-attendance-web.apk`**: Web-wrapped Capacitor Android App.

            ### Instructions:
            1. Download `.apk` to your phone.
            2. Enable "Install from unknown sources" if prompted.
            3. Open to install **SWE-Attendance**.
          files: |
            swe-attendance-flutter.apk
            swe-attendance-web.apk
