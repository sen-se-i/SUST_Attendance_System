name: Build and release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  API_BASE_URL: https://swe-attendance.onrender.com

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Upload APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter Android platform files
        working-directory: flutter_app
        run: flutter create --no-pub --platforms=android . || true

      - name: Customize Flutter App Name and Icon
        run: |
          # Copy custom launcher icons from capacitor project to flutter project
          cp -r frontend/android/app/src/main/res/mipmap-* flutter_app/android/app/src/main/res/
          
          # Replace application label in AndroidManifest.xml
          python3 -c "
          import os, re
          manifest_path = 'flutter_app/android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              # Replace label matching any android:label
              content = re.sub(r'android:label=\"[^\"]+\"', 'android:label=\"SWE Attendance System\"', content)
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Successfully customized Flutter AndroidManifest.xml')
          else:
              print('AndroidManifest.xml not found!')
          "

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get || true

      - name: Build Flutter APK
        working-directory: flutter_app
        run: flutter build apk --debug || true

      - name: Copy Flutter APK
        run: |
          mkdir -p release_apks
          find flutter_app/build -name "*.apk" -exec cp {} release_apks/swe-attendance-flutter.apk \; || true

      - name: Install Web frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web assets for Capacitor
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: npx vite build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build Capacitor APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy Capacitor APK
        run: |
          mkdir -p release_apks
          find frontend/android/app/build -name "*.apk" -exec cp {} release_apks/swe-attendance-app.apk \;

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SWE-Attendance ${{ github.ref_name }}
          body: |
            ## 📍 SWE-Attendance Release ${{ github.ref_name }}

            ### Downloadable Android APKs:
            - **`swe-attendance-app.apk`**: Android Application Package (Ready for installation).
            - **`swe-attendance-flutter.apk`**: Flutter Native Android Application.

            ### How to Install on Android:
            1. Download **`swe-attendance-app.apk`** below to your phone.
            2. If prompted, enable **"Allow installation from unknown sources"**.
            3. Tap the file to install **SWE-Attendance**.
          files: release_apks/*.apk
